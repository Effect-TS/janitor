name: Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@27ddd5a8e32d89312fdd2c227d7d1613ca5465b0 # v1.16.1
        with:
          version: "0.3.0"
          node-version: "24.19.0"
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: docker info
      - run: vp run runner:check
      - run: vp run runner:build
      - run: vp run runner:test:bridge
      - run: vp test
      - name: Validate the local Alchemy stack
        env:
          JANITOR_MAINTENANCE_TOKEN: local-ci-validation
        run: |
          vp run dev > /tmp/janitor-alchemy.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 180); do
            if curl --fail --silent --max-time 2 http://localhost:8787/api/v1/ready >/dev/null && \
               curl --fail --silent --max-time 2 -H 'authorization: Bearer janitor-local-runner' http://localhost:8790/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done
          vp run runner:smoke
      - name: Retain local Alchemy diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alchemy-local-diagnostics
          path: /tmp/janitor-alchemy.log
          if-no-files-found: ignore
