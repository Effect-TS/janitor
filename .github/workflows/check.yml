name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@27ddd5a8e32d89312fdd2c227d7d1613ca5465b0 # v1.16.1
        with:
          version: "0.3.0"
          node-version: "24.19.0"
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run check:dependencies
      - run: vp check
      - run: vp test
      - run: vp run build:web
      - run: vp run check:worker-bundle
