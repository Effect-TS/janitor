name: Deploy

on:
  # Deploy only commits that passed Check, instead of repeating its work here.
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        default: plan
        options: [plan, deploy]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      # Logs in to Infisical as INFISICAL_IDENTITY_ID with GitHub's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # A workflow_run event otherwise checks out the latest main, not the commit Check passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: voidzero-dev/setup-vp@27ddd5a8e32d89312fdd2c227d7d1613ca5465b0 # v1.16.1
        with:
          version: "0.3.0"
          node-version: "24.19.0"
          run-install: false
          cache: true
      - run: vp install --frozen-lockfile
      - run: docker info
      - name: Plan or deploy production
        env:
          ALCHEMY_MODE: ${{ inputs.action == 'plan' && '--dry-run' || '--yes' }}
          # Everything else comes from Infisical (project janitor, environment production).
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
        run: vp exec alchemy deploy alchemy.run.ts --stage production "$ALCHEMY_MODE"
