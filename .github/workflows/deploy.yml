name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        default: plan
        options: [plan, deploy]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@27ddd5a8e32d89312fdd2c227d7d1613ca5465b0 # v1.16.1
        with:
          version: "0.3.0"
          node-version: "24.19.0"
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test
      - name: Plan or deploy production
        env:
          ALCHEMY_MODE: ${{ inputs.action == 'plan' && '--dry-run' || '--yes' }}
          JANITOR_STAGE: production
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          CLOUDFLARE_ACCESS_GITHUB_IDP_ID: ${{ vars.CLOUDFLARE_ACCESS_GITHUB_IDP_ID }}
          NEON_HISTORY_RETENTION_SECONDS: ${{ vars.NEON_HISTORY_RETENTION_SECONDS || '604800' }}
          JANITOR_GITHUB_APP_ID: ${{ vars.JANITOR_GITHUB_APP_ID }}
          JANITOR_GITHUB_APP_PRIVATE_KEY: ${{ secrets.JANITOR_GITHUB_APP_PRIVATE_KEY }}
          JANITOR_GITHUB_WEBHOOK_SECRET: ${{ secrets.JANITOR_GITHUB_WEBHOOK_SECRET }}
          JANITOR_GITHUB_WEBHOOK_PAYLOAD_KEY: ${{ secrets.JANITOR_GITHUB_WEBHOOK_PAYLOAD_KEY }}
          JANITOR_GITHUB_WEBHOOK_PAYLOAD_KEY_ID: ${{ vars.JANITOR_GITHUB_WEBHOOK_PAYLOAD_KEY_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL: ${{ vars.OPENAI_API_URL }}
          LABELING_AI_MODEL: ${{ vars.LABELING_AI_MODEL }}
          LABELING_AI_INPUT_BYTES: ${{ vars.LABELING_AI_INPUT_BYTES }}
          JANITOR_INITIAL_ADMIN_SUBJECT: ${{ vars.JANITOR_INITIAL_ADMIN_SUBJECT }}
          JANITOR_SLACK_CLIENT_ID: ${{ vars.JANITOR_SLACK_CLIENT_ID }}
          JANITOR_SLACK_CLIENT_SECRET: ${{ secrets.JANITOR_SLACK_CLIENT_SECRET }}
          JANITOR_SLACK_WORKSPACE_IDS: ${{ vars.JANITOR_SLACK_WORKSPACE_IDS }}
          JANITOR_GITHUB_OAUTH_CLIENT_ID: ${{ vars.JANITOR_GITHUB_OAUTH_CLIENT_ID }}
          JANITOR_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.JANITOR_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          # Empty optional GitHub settings should use the application's defaults.
          for setting in OPENAI_API_KEY OPENAI_API_URL LABELING_AI_MODEL LABELING_AI_INPUT_BYTES \
            JANITOR_INITIAL_ADMIN_SUBJECT JANITOR_SLACK_CLIENT_ID JANITOR_SLACK_CLIENT_SECRET \
            JANITOR_SLACK_WORKSPACE_IDS JANITOR_GITHUB_OAUTH_CLIENT_ID JANITOR_GITHUB_OAUTH_CLIENT_SECRET; do
            if [[ -z "${!setting}" ]]; then unset "$setting"; fi
          done
          vp exec alchemy deploy alchemy.run.ts --stage production "$ALCHEMY_MODE"
