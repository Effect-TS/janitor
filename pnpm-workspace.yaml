  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: ^0.3.0
  yaml: 2.9.0

overrides:
  vitest: "catalog:"
  "effect": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/platform-cloudflare": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/platform-browser": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/ai-openai-compat": "catalog:"
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: false
  ssh2: false
  workerd: true

minimumReleaseAgeExclude:
