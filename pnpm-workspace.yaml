  "@foldkit/devtools-mcp": ^0.24.0
  "@foldkit/oxlint-plugin": ^0.15.1
  "@foldkit/ui": ^0.165.0
  "@foldkit/vite-plugin": ^0.26.0
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@testcontainers/postgresql": 12.1.0
  "@types/node": ^24.13.3
  alchemy: 2.0.0-beta.80
  "@distilled.cloud/cloudflare": 1.0.0-rc.13
  clsx: ^2.1.1
  effect: https://pkg.pr.new/Effect-TS/effect/effect@7c5525a6c2084247c262fef7c2045c94c10f0e67
  happy-dom: ^20.0.0
  foldkit: ^0.165.0
  lucide: ^1.33.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: ^0.3.0
  yaml: 2.9.0

overrides:
  "@effect/opentelemetry": "catalog:"
  vitest: "catalog:"
  "effect": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/platform-cloudflare": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/platform-browser": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/sql-d1": "catalog:"
  "@effect/sql-sqlite-do": "catalog:"
  "@effect/ai-openrouter": "catalog:"
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@parcel/watcher": false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: false
  ssh2: false
  workerd: true

minimumReleaseAgeExclude:
  - "@alchemy.run/*"
  - "@distilled.cloud/*"
  - "@foldkit/*"
  - alchemy
  - foldkit

patchedDependencies:
  alchemy@2.0.0-beta.80: patches/alchemy@2.0.0-beta.80.patch
