packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/commands": 6.10.4
  "@codemirror/lang-yaml": 6.1.3
  "@codemirror/language": 6.12.4
  "@codemirror/lint": 6.9.7
  "@codemirror/search": 6.7.1
  "@codemirror/state": 6.7.1
  "@codemirror/view": 6.43.8
  "@lezer/common": 1.5.2
  "@uiw/codemirror-theme-github": 4.25.11
  "@effect/ai-openai-compat": 4.0.0-rc.112
  "@effect/platform-browser": 4.0.0-rc.112
  "@effect/platform-node": 4.0.0-rc.112
  "@effect/sql-pg": 4.0.0-rc.112
  "@effect/tsgo": ^0.38.0
  "@effect/vitest": 4.0.0-rc.112
  "@foldkit/devtools": ^0.157.0
  "@foldkit/devtools-mcp": ^0.19.3
  "@foldkit/oxlint-plugin": ^0.12.0
  "@foldkit/ui": ^0.157.0
  "@foldkit/vite-plugin": ^0.20.1
  "@fontsource-variable/geist": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@testcontainers/postgresql": 12.1.0
  "@types/node": ^24.13.3
  alchemy: 2.0.0-beta.75
  clsx: ^2.1.1
  effect: 4.0.0-rc.112
  happy-dom: ^20.0.0
  foldkit: ^0.157.0
  lucide: ^1.33.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: ^0.3.0
  yaml: 2.9.0

overrides:
  "@effect/vitest": link:../effect/packages/vitest
  "web>effect": "catalog:"
  effect: link:../effect/packages/effect
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  cpu-features: set this to true or false
  esbuild: false
  msgpackr-extract: false
  protobufjs: set this to true or false
  sharp: false
  ssh2: set this to true or false
  workerd: true

minimumReleaseAgeExclude:
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.75"
  - "@alchemy.run/floci@2.0.0-beta.75"
  - "@alchemy.run/node-utils@2.0.0-beta.75"
  - "@distilled.cloud/aws@1.0.0-rc.8"
  - "@distilled.cloud/axiom@1.0.0-rc.8"
  - "@distilled.cloud/cloudflare@1.0.0-rc.8"
  - "@distilled.cloud/core@1.0.0-rc.8"
  - "@distilled.cloud/fly-io@1.0.0-rc.8"
  - "@distilled.cloud/hetzner@1.0.0-rc.8"
  - "@distilled.cloud/neon@1.0.0-rc.8"
  - "@distilled.cloud/planetscale@1.0.0-rc.8"
  - "@foldkit/devtools@0.157.0"
  - "@foldkit/ui@0.157.0"
  - "@foldkit/vite-plugin@0.20.1"
  - alchemy@2.0.0-beta.75
  - foldkit@0.157.0

patchedDependencies:
  "@alchemy.run/cloudflare-runtime@2.0.0-beta.75": patches/@alchemy.run__cloudflare-runtime@2.0.0-beta.75.patch
  "@distilled.cloud/aws@1.0.0-rc.8": patches/@distilled.cloud__aws@1.0.0-rc.8.patch
  "@distilled.cloud/axiom@1.0.0-rc.8": patches/@distilled.cloud__axiom@1.0.0-rc.8.patch
  "@distilled.cloud/cloudflare@1.0.0-rc.8": patches/@distilled.cloud__cloudflare@1.0.0-rc.8.patch
  "@distilled.cloud/core@1.0.0-rc.8": patches/@distilled.cloud__core@1.0.0-rc.8.patch
  "@distilled.cloud/fly-io@1.0.0-rc.8": patches/@distilled.cloud__fly-io@1.0.0-rc.8.patch
  "@distilled.cloud/hetzner@1.0.0-rc.8": patches/@distilled.cloud__hetzner@1.0.0-rc.8.patch
  "@distilled.cloud/planetscale@1.0.0-rc.8": patches/@distilled.cloud__planetscale@1.0.0-rc.8.patch
  alchemy@2.0.0-beta.75: patches/alchemy@2.0.0-beta.75.patch
