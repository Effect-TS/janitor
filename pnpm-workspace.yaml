packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# The Effect packages are pinned to the effect/chat PR snapshot (Effect-TS/effect#10581),
# which pnpm resolves by URL. The overrides below hand that URL to subdependencies such
# as @foldkit/vite-plugin's @effect/platform-node, which pnpm blocks by default.
# Restore the default once the catalog is back on registry versions.
blockExoticSubdeps: false

catalog:
  vitest: 5.1.0
  "@effect/platform-node-shared": https://pkg.pr.new/Effect-TS/effect/@effect/platform-node-shared@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/platform-cloudflare": https://pkg.pr.new/Effect-TS/effect/@effect/platform-cloudflare@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/commands": 6.10.4
  "@codemirror/lang-yaml": 6.1.3
  "@codemirror/language": 6.12.4
  "@codemirror/lint": 6.9.7
  "@codemirror/search": 6.7.1
  "@codemirror/state": 6.7.1
  "@codemirror/view": 6.43.8
  "@lezer/common": 1.5.2
  "@uiw/codemirror-theme-github": 4.25.11
  "@effect/ai-openrouter": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openrouter@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/ai-openai": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openai@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/ai-openai-compat": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openai-compat@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/sql-sqlite-node": https://pkg.pr.new/Effect-TS/effect/@effect/sql-sqlite-node@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/platform-browser": https://pkg.pr.new/Effect-TS/effect/@effect/platform-browser@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/platform-node": https://pkg.pr.new/Effect-TS/effect/@effect/platform-node@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/opentelemetry": https://pkg.pr.new/Effect-TS/effect/@effect/opentelemetry@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/graphql-generator": https://pkg.pr.new/Effect-TS/effect/@effect/graphql-generator@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/sql-pg": https://pkg.pr.new/Effect-TS/effect/@effect/sql-pg@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/sql-d1": https://pkg.pr.new/Effect-TS/effect/@effect/sql-d1@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/sql-sqlite-do": https://pkg.pr.new/Effect-TS/effect/@effect/sql-sqlite-do@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/tsgo": ^0.67.5
  "@effect/vitest": https://pkg.pr.new/Effect-TS/effect/@effect/vitest@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/chat-slack": https://pkg.pr.new/Effect-TS/effect/@effect/chat-slack@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@effect/chat-discord": https://pkg.pr.new/Effect-TS/effect/@effect/chat-discord@42cf7c020f081f7ccbd64d20cb6c1252b8477365
  "@foldkit/devtools": ^0.170.0
  "@foldkit/devtools-mcp": ^0.26.0
  "@foldkit/oxlint-plugin": ^0.15.1
  "@foldkit/ui": ^0.170.0
  "@foldkit/vite-plugin": ^0.29.0
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@testcontainers/postgresql": 12.1.0
  "@types/node": ^24.13.3
  alchemy: 2.0.0-beta.85
  "@alchemy.run/cloudflare": 2.0.0-beta.85
  "@alchemy.run/docker": 2.0.0-beta.85
  "@alchemy.run/github": 2.0.0-beta.85
  "@alchemy.run/infisical": 2.0.0-beta.85
  "@alchemy.run/sql": 2.0.0-beta.85
  "@distilled.cloud/cloudflare": 1.0.0-rc.17
  clanka: 0.24.5
  "@modelcontextprotocol/sdk": 1.32.2
  dfx: 1.1.1
  clsx: ^2.1.1
  effect: https://pkg.pr.new/Effect-TS/effect/effect@42cf7c020f081f7ccbd64d20cb6c1252b8477365
