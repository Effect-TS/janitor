packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# Allow the commit-pinned Effect snapshot URLs in transitive dependencies.
blockExoticSubdeps: false

catalog:
  vitest: 4.1.11
  "@effect/platform-node-shared": https://pkg.pr.new/Effect-TS/effect/@effect/platform-node-shared@a8e31fe7ef29ce258788bea83e7684cb44f8d045
  "@effect/platform-cloudflare": https://pkg.pr.new/Effect-TS/effect/@effect/platform-cloudflare@a8e31fe7ef29ce258788bea83e7684cb44f8d045
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/commands": 6.10.4
  "@codemirror/lang-yaml": 6.1.3
  "@codemirror/language": 6.12.4
  "@codemirror/lint": 6.9.7
  "@codemirror/search": 6.7.1
  "@codemirror/state": 6.7.1
  "@codemirror/view": 6.43.8
  "@lezer/common": 1.5.2
  "@uiw/codemirror-theme-github": 4.25.11
  "@effect/ai-openai-compat": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openai-compat@a8e31fe7ef29ce258788bea83e7684cb44f8d045
  "@effect/platform-browser": https://pkg.pr.new/Effect-TS/effect/@effect/platform-browser@a8e31fe7ef29ce258788bea83e7684cb44f8d045
  "@effect/platform-node": https://pkg.pr.new/Effect-TS/effect/@effect/platform-node@a8e31fe7ef29ce258788bea83e7684cb44f8d045
  "@effect/opentelemetry": https://pkg.pr.new/Effect-TS/effect/@effect/opentelemetry@a8e31fe7ef29ce258788bea83e7684cb44f8d045
  "@effect/sql-pg": https://pkg.pr.new/Effect-TS/effect/@effect/sql-pg@a8e31fe7ef29ce258788bea83e7684cb44f8d045
  "@effect/tsgo": ^0.38.0
  "@effect/vitest": https://pkg.pr.new/Effect-TS/effect/@effect/vitest@a8e31fe7ef29ce258788bea83e7684cb44f8d045
  "@foldkit/devtools": ^0.163.0
  "@foldkit/devtools-mcp": ^0.22.0
  "@foldkit/oxlint-plugin": ^0.15.0
  "@foldkit/ui": ^0.163.0
  "@foldkit/vite-plugin": ^0.24.0
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@testcontainers/postgresql": 12.1.0
  "@types/node": ^24.13.3
  alchemy: 2.0.0-beta.79
  clsx: ^2.1.1
  effect: https://pkg.pr.new/Effect-TS/effect/effect@a8e31fe7ef29ce258788bea83e7684cb44f8d045
  happy-dom: ^20.0.0
  foldkit: ^0.163.0
  lucide: ^1.33.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: ^0.3.0
  yaml: 2.9.0

overrides:
  "@effect/opentelemetry": "catalog:"
  vitest: "catalog:"
  "effect": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/platform-cloudflare": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/platform-browser": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/ai-openai-compat": "catalog:"
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@parcel/watcher": false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: false
  ssh2: false
  workerd: true

minimumReleaseAgeExclude:
  - "@alchemy.run/*"
  - "@distilled.cloud/*"
  - "@foldkit/*"
  - alchemy
  - foldkit

patchedDependencies:
  "@alchemy.run/cloudflare-runtime@2.0.0-beta.79": patches/@alchemy.run__cloudflare-runtime@2.0.0-beta.79.patch
  "@effect/ai-openai-compat@4.0.0-rc.117": patches/@effect__ai-openai-compat@4.0.0-rc.117.patch
  alchemy@2.0.0-beta.79: patches/alchemy@2.0.0-beta.79.patch
