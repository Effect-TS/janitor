packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  vitest: 5.1.0
  "@effect/platform-node-shared": 4.1.3
  "@effect/platform-cloudflare": 4.1.3
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/commands": 6.10.4
  "@codemirror/lang-yaml": 6.1.3
  "@codemirror/language": 6.12.4
  "@codemirror/lint": 6.9.7
  "@codemirror/search": 6.7.1
  "@codemirror/state": 6.7.1
  "@codemirror/view": 6.43.8
  "@lezer/common": 1.5.2
  "@uiw/codemirror-theme-github": 4.25.11
  "@effect/ai-openrouter": 4.1.3
  "@effect/ai-openai": 4.1.3
  "@effect/ai-openai-compat": 4.1.3
  "@effect/sql-sqlite-node": 4.1.3
  "@effect/platform-browser": 4.1.3
  "@effect/platform-node": 4.1.3
  "@effect/opentelemetry": 4.1.3
  "@effect/graphql-generator": 4.1.3
  "@effect/sql-pg": 4.1.3
  "@effect/sql-d1": 4.1.3
  "@effect/sql-sqlite-do": 4.1.3
  "@effect/tsgo": ^0.67.5
  "@effect/vitest": 4.1.3
  "@foldkit/devtools": ^0.170.0
  "@foldkit/devtools-mcp": ^0.26.0
  "@foldkit/oxlint-plugin": ^0.15.1
  "@foldkit/ui": ^0.170.0
  "@foldkit/vite-plugin": ^0.29.0
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@testcontainers/postgresql": 12.1.0
  "@types/node": ^24.13.3
  alchemy: 2.0.0-beta.85
  "@alchemy.run/cloudflare": 2.0.0-beta.85
  "@alchemy.run/docker": 2.0.0-beta.85
  "@alchemy.run/github": 2.0.0-beta.85
  "@alchemy.run/infisical": 2.0.0-beta.85
  "@alchemy.run/sql": 2.0.0-beta.85
  "@distilled.cloud/cloudflare": 1.0.0-rc.17
  clanka: 0.24.4
  "@modelcontextprotocol/sdk": 1.32.2
  dfx: 1.1.1
  clsx: ^2.1.1
  effect: 4.1.3
  happy-dom: ^20.0.0
  foldkit: ^0.170.0
  graphql: 17.0.2
  lucide: ^1.33.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: ^1.5.1
  yaml: 2.9.0

overrides:
  "@effect/opentelemetry": "catalog:"
  vitest: "catalog:"
  "effect": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/platform-cloudflare": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/platform-browser": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/sql-d1": "catalog:"
  "@effect/sql-sqlite-do": "catalog:"
  "@effect/ai-openrouter": "catalog:"
  "@effect/ai-openai": "catalog:"
  "@effect/ai-openai-compat": "catalog:"
  "@effect/sql-sqlite-node": "catalog:"
  vite: "catalog:"

# The GitHub theme imports these packages without declaring them.
packageExtensions:
  "@uiw/codemirror-theme-github@4.25.11":
    dependencies:
      "@babel/runtime": ^7.29.7
      "@lezer/highlight": ^1.2.3

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@parcel/watcher": false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: false
  ssh2: false
  workerd: true
  # clanka's SemanticSearch needs these; the sandbox executor doesn't use it.
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false

minimumReleaseAgeExclude:
  - "@effect/platform-node-shared@4.1.3"
  - "@effect/platform-cloudflare@4.1.3"
  - "@effect/ai-openrouter@4.1.3"
  - "@effect/ai-openai@4.1.3"
  - "@effect/ai-openai-compat@4.1.3"
  - "@effect/sql-sqlite-node@4.1.3"
  - "@effect/platform-browser@4.1.3"
  - "@effect/platform-node@4.1.3"
  - "@effect/opentelemetry@4.1.3"
  - "@effect/graphql-generator@4.1.3"
  - "@effect/sql-pg@4.1.3"
  - "@effect/sql-d1@4.1.3"
  - "@effect/sql-sqlite-do@4.1.3"
  - "@effect/vitest@4.1.3"
  - effect@4.1.3
  - "@effect/tsgo@0.67.5"
  - vite-plus@1.5.1
  - "@voidzero-dev/vite-plus-core@1.5.1"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.5.1"
  - "@voidzero-dev/vite-plus-darwin-x64@1.5.1"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.1"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.5.1"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.5.1"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.5.1"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.1"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.5.1"
  - "@alchemy.run/*"
  - "@distilled.cloud/*"
  - "@foldkit/*"
  - alchemy
  - foldkit
  - clanka@0.24.4

patchedDependencies:
  alchemy@2.0.0-beta.85: patches/alchemy@2.0.0-beta.85.patch
  "@alchemy.run/cloudflare@2.0.0-beta.85": patches/@alchemy.run__cloudflare@2.0.0-beta.85.patch
