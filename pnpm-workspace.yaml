packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# Allow the commit-pinned Effect snapshot URLs in transitive dependencies.
blockExoticSubdeps: false

catalog:
  vitest: 4.1.11
  "@effect/platform-node-shared": https://pkg.pr.new/Effect-TS/effect/@effect/platform-node-shared@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/platform-cloudflare": https://pkg.pr.new/Effect-TS/effect/@effect/platform-cloudflare@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/commands": 6.10.4
  "@codemirror/lang-yaml": 6.1.3
  "@codemirror/language": 6.12.4
  "@codemirror/lint": 6.9.7
  "@codemirror/search": 6.7.1
  "@codemirror/state": 6.7.1
  "@codemirror/view": 6.43.8
  "@lezer/common": 1.5.2
  "@uiw/codemirror-theme-github": 4.25.11
  "@effect/ai-openrouter": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openrouter@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/ai-openai": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openai@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/ai-openai-compat": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openai-compat@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/sql-sqlite-node": https://pkg.pr.new/Effect-TS/effect/@effect/sql-sqlite-node@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/platform-browser": https://pkg.pr.new/Effect-TS/effect/@effect/platform-browser@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/platform-node": https://pkg.pr.new/Effect-TS/effect/@effect/platform-node@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/opentelemetry": https://pkg.pr.new/Effect-TS/effect/@effect/opentelemetry@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/graphql-generator": https://pkg.pr.new/Effect-TS/effect/@effect/graphql-generator@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/sql-pg": https://pkg.pr.new/Effect-TS/effect/@effect/sql-pg@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/sql-d1": https://pkg.pr.new/Effect-TS/effect/@effect/sql-d1@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/sql-sqlite-do": https://pkg.pr.new/Effect-TS/effect/@effect/sql-sqlite-do@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@effect/tsgo": ^0.38.0
  "@effect/vitest": https://pkg.pr.new/Effect-TS/effect/@effect/vitest@2646b53aebe919d6994449d36c65a4aaaff5b974
  "@foldkit/devtools": ^0.165.0
  "@foldkit/devtools-mcp": ^0.24.0
  "@foldkit/oxlint-plugin": ^0.15.1
  "@foldkit/ui": ^0.165.0
  "@foldkit/vite-plugin": ^0.26.0
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@testcontainers/postgresql": 12.1.0
  "@types/node": ^24.13.3
  alchemy: 2.0.0-beta.84
  "@alchemy.run/cloudflare": 2.0.0-beta.84
  "@alchemy.run/docker": 2.0.0-beta.84
  "@alchemy.run/github": 2.0.0-beta.84
  "@alchemy.run/infisical": 2.0.0-beta.84
  "@alchemy.run/sql": 2.0.0-beta.84
  "@distilled.cloud/cloudflare": 1.0.0-rc.17
  clanka: 0.13.2
  dfx: 1.1.1
  clsx: ^2.1.1
  effect: https://pkg.pr.new/Effect-TS/effect/effect@2646b53aebe919d6994449d36c65a4aaaff5b974
  happy-dom: ^20.0.0
  foldkit: ^0.165.0
  graphql: 17.0.2
  lucide: ^1.33.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: ^0.3.0
  yaml: 2.9.0

overrides:
  "@effect/opentelemetry": "catalog:"
  vitest: "catalog:"
  "effect": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/platform-cloudflare": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/platform-browser": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/sql-d1": "catalog:"
  "@effect/sql-sqlite-do": "catalog:"
  "@effect/ai-openrouter": "catalog:"
  "@effect/ai-openai": "catalog:"
  "@effect/ai-openai-compat": "catalog:"
  "@effect/sql-sqlite-node": "catalog:"
  vite: "catalog:"

# The GitHub theme imports these packages without declaring them.
packageExtensions:
  "@uiw/codemirror-theme-github@4.25.11":
    dependencies:
      "@babel/runtime": ^7.29.7
      "@lezer/highlight": ^1.2.3

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@parcel/watcher": false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: false
  ssh2: false
  workerd: true
  # clanka's SemanticSearch needs these; the sandbox executor doesn't use it.
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false

minimumReleaseAgeExclude:
  - "@alchemy.run/*"
  - "@distilled.cloud/*"
  - "@foldkit/*"
  - alchemy
  - foldkit
  - clanka@0.13.2

patchedDependencies:
  alchemy@2.0.0-beta.84: patches/alchemy@2.0.0-beta.84.patch
  "@alchemy.run/cloudflare@2.0.0-beta.84": patches/@alchemy.run__cloudflare@2.0.0-beta.84.patch
