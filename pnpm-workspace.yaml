packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# Effect snapshots also occur in transitive dependencies. check:dependencies
# restricts remote tarballs to the commit-pinned catalog URLs below.
blockExoticSubdeps: false

