  "@effect/sql-pg": 4.0.0-rc.112
  "@effect/tsgo": ^0.38.0
  "@effect/vitest": https://pkg.pr.new/Effect-TS/effect/@effect/vitest@ec83cbdb3c0b0f89df627a7895939a359db9f4ab
  "@foldkit/devtools": ^0.157.0
  "@foldkit/devtools-mcp": ^0.19.3
  "@foldkit/oxlint-plugin": ^0.12.0
  "@foldkit/ui": ^0.157.0
  "@foldkit/vite-plugin": ^0.20.1
  "@fontsource-variable/geist": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@testcontainers/postgresql": 12.1.0
  "@types/node": ^24.13.3
  alchemy: 2.0.0-beta.76
