packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# Allow the commit-pinned Effect snapshot URLs in transitive dependencies, and
# the pkg.alchemy.run tarball URLs the Alchemy preview builds pin their own
# dependencies by. Keep this until both are back on npm releases.
blockExoticSubdeps: false

catalog:
  vitest: 4.1.11
  "@effect/platform-node-shared": https://pkg.pr.new/Effect-TS/effect/@effect/platform-node-shared@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/platform-cloudflare": https://pkg.pr.new/Effect-TS/effect/@effect/platform-cloudflare@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/commands": 6.10.4
  "@codemirror/lang-yaml": 6.1.3
  "@codemirror/language": 6.12.4
  "@codemirror/lint": 6.9.7
  "@codemirror/search": 6.7.1
  "@codemirror/state": 6.7.1
  "@codemirror/view": 6.43.8
  "@lezer/common": 1.5.2
  "@uiw/codemirror-theme-github": 4.25.11
  "@effect/ai-openrouter": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openrouter@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/ai-openai": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openai@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/ai-openai-compat": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openai-compat@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/sql-sqlite-node": https://pkg.pr.new/Effect-TS/effect/@effect/sql-sqlite-node@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/platform-browser": https://pkg.pr.new/Effect-TS/effect/@effect/platform-browser@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/platform-node": https://pkg.pr.new/Effect-TS/effect/@effect/platform-node@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/opentelemetry": https://pkg.pr.new/Effect-TS/effect/@effect/opentelemetry@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/graphql-generator": https://pkg.pr.new/Effect-TS/effect/@effect/graphql-generator@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/sql-pg": https://pkg.pr.new/Effect-TS/effect/@effect/sql-pg@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/sql-d1": https://pkg.pr.new/Effect-TS/effect/@effect/sql-d1@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/sql-sqlite-do": https://pkg.pr.new/Effect-TS/effect/@effect/sql-sqlite-do@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@effect/tsgo": ^0.38.0
  "@effect/vitest": https://pkg.pr.new/Effect-TS/effect/@effect/vitest@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  "@foldkit/devtools": ^0.170.0
  "@foldkit/devtools-mcp": ^0.26.0
  "@foldkit/oxlint-plugin": ^0.15.1
  "@foldkit/ui": ^0.170.0
  "@foldkit/vite-plugin": ^0.29.0
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@testcontainers/postgresql": 12.1.0
  "@types/node": ^24.13.3
  # Preview builds of alchemy-run/alchemy main at 55e34d0272, the commit
  # Effect-TS/website pins, addressed by content hash. The shared Cloudflare
  # state store speaks protocol v8, which no npm release supports yet: beta.84
  # expects v7 and would redeploy the store at v7 under `--yes`. Move back to
  # npm once a release supports v8. See patches/README.md.
  alchemy: https://pkg.alchemy.run/alchemy/-/a2ab0b905a1019317f999b820778c9f6b9d8fdbeedaee02fd825d977423a4412.tgz
  "@alchemy.run/cloudflare": https://pkg.alchemy.run/@alchemy.run/cloudflare/-/4e37a6f49e8bc4163df5c91d0f6636b7ba298f05931b18dc0c21fe63b2a9f5de.tgz
  "@alchemy.run/docker": https://pkg.alchemy.run/@alchemy.run/docker/-/1b0c7c8bfaf7cd4395bb18af581721a82a360283ebd9d45b0bcee49a7f9e4ef8.tgz
  "@alchemy.run/github": https://pkg.alchemy.run/@alchemy.run/github/-/d49befa512d2912458aa7b97096264017284be57a3ad7fab01cd3457f8deb64a.tgz
  "@alchemy.run/infisical": https://pkg.alchemy.run/@alchemy.run/infisical/-/4c70f8cbd7aca310b5d78660fdd733bacc31f0b8f83fb33ab6f3a77e47be792f.tgz
  "@alchemy.run/sql": https://pkg.alchemy.run/@alchemy.run/sql/-/7b97560aba68677888362a314915c15e930ce2022caac5fa932f8b970fc6116b.tgz
  "@distilled.cloud/cloudflare": 1.0.0-rc.17
  clanka: 0.13.2
  dfx: 1.1.1
  clsx: ^2.1.1
  effect: https://pkg.pr.new/Effect-TS/effect/effect@111d7cfdd4fb15079fcb0b56b98d2290e40cd5b8
  happy-dom: ^20.0.0
  foldkit: ^0.170.0
  graphql: 17.0.2
  lucide: ^1.33.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: ^0.3.0
  yaml: 2.9.0

overrides:
  "@effect/opentelemetry": "catalog:"
  vitest: "catalog:"
  "effect": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/platform-cloudflare": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/platform-browser": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/sql-d1": "catalog:"
  "@effect/sql-sqlite-do": "catalog:"
  "@effect/ai-openrouter": "catalog:"
  "@effect/ai-openai": "catalog:"
  "@effect/ai-openai-compat": "catalog:"
  "@effect/sql-sqlite-node": "catalog:"
  vite: "catalog:"

# The GitHub theme imports these packages without declaring them.
packageExtensions:
  "@uiw/codemirror-theme-github@4.25.11":
    dependencies:
      "@babel/runtime": ^7.29.7
      "@lezer/highlight": ^1.2.3

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@parcel/watcher": false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: false
  ssh2: false
  workerd: true
  # clanka's SemanticSearch needs these; the sandbox executor doesn't use it.
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false

minimumReleaseAgeExclude:
  - "@alchemy.run/*"
  - "@distilled.cloud/*"
  - "@foldkit/*"
  - alchemy
  - foldkit
  - clanka@0.13.2

# The Alchemy preview builds report version 2.0.0-beta.84, the same as the npm
# release they replace; the patch files are named for the commit they target.
patchedDependencies:
  alchemy@2.0.0-beta.84: patches/alchemy@55e34d0272.patch
  "@alchemy.run/cloudflare@2.0.0-beta.84": patches/@alchemy.run__cloudflare@55e34d0272.patch
