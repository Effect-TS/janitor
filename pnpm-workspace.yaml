  vitest: 4.1.11
  "@effect/platform-node-shared": https://pkg.pr.new/Effect-TS/effect/@effect/platform-node-shared@7c5525a6c2084247c262fef7c2045c94c10f0e67
  "@effect/platform-cloudflare": https://pkg.pr.new/Effect-TS/effect/@effect/platform-cloudflare@7c5525a6c2084247c262fef7c2045c94c10f0e67
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/commands": 6.10.4
  "@codemirror/lang-yaml": 6.1.3
  "@codemirror/language": 6.12.4
  "@codemirror/lint": 6.9.7
  "@codemirror/search": 6.7.1
  "@codemirror/state": 6.7.1
  "@codemirror/view": 6.43.8
  "@lezer/common": 1.5.2
  "@uiw/codemirror-theme-github": 4.25.11
  "@effect/ai-openrouter": https://pkg.pr.new/Effect-TS/effect/@effect/ai-openrouter@7c5525a6c2084247c262fef7c2045c94c10f0e67
  "@effect/platform-browser": https://pkg.pr.new/Effect-TS/effect/@effect/platform-browser@7c5525a6c2084247c262fef7c2045c94c10f0e67
  "@effect/platform-node": https://pkg.pr.new/Effect-TS/effect/@effect/platform-node@7c5525a6c2084247c262fef7c2045c94c10f0e67
  "@effect/opentelemetry": https://pkg.pr.new/Effect-TS/effect/@effect/opentelemetry@7c5525a6c2084247c262fef7c2045c94c10f0e67
  "@effect/sql-pg": https://pkg.pr.new/Effect-TS/effect/@effect/sql-pg@7c5525a6c2084247c262fef7c2045c94c10f0e67
  "@effect/sql-d1": https://pkg.pr.new/Effect-TS/effect/@effect/sql-d1@7c5525a6c2084247c262fef7c2045c94c10f0e67
