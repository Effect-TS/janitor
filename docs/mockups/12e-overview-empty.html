    <style>
      .ov-shell {
        min-height: 100vh;
      }
      .quiet-overview {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 48px 24px 120px;
      }
      .quiet-message {
        text-align: center;
      }
      .quiet-repo {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        margin: 0 auto 18px;
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 10px;
        font-size: 15px;
        color: var(--muted-foreground);
      }
      .quiet-message h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: -0.025em;
      }
      .quiet-message p {
        margin: 7px 0 22px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .quiet-message .btn {
        padding: 7px 12px;
        gap: 12px;
      }
      a[aria-disabled] {
        cursor: default;
      }
      @media (max-width: 760px) {
        main {
          min-height: 65vh;
        }
        .quiet-overview {
          padding: 60px 24px 100px;
        }
      }
    </style>
